[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank here — migrations/env.py sets it
# from db.DATABASE_URL (which itself reads DATABASE_URL from backend/.env),
# so the connection string has a single source of truth.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console, file

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console, file
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = INFO
formatter = generic

[handler_file]
class = FileHandler
args = ('fastapi_backend.log', 'a', 'utf-8')
level = INFO
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
